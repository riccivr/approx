name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-unix:
    name: Test on ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          make CC=${{ matrix.compiler }} clean
          make CC=${{ matrix.compiler }} test-all

      - name: Run Sanitizers (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          make CC=clang sanitize

  test-windows:
    name: Test on Windows (MSYS2 MinGW)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc

      - name: Build and Test
        shell: msys2 {0}
        run: |
          make CC=gcc test-all
